<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NOVA STYLE - Welcome Back Sign In Page. Premium design conversion with sleek aesthetics and mobile-first responsiveness.">
  <title>Welcome Back - NOVA STYLE</title>
  
  <!-- Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet"  href="{% static 'css/staff/admin_login.css' %}">
</head>
<body>
  <main class="container">
    <section class="card">
      <header class="card-header">
        <h1 class="brand-title">NOVA STYLE</h1>
        <h2 class="welcome-text">Welcome Back</h2>
      </header>
      
      <form class="signin-form" method="post" >
        {% csrf_token %}
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              name="email"
              id="email" 
              class="form-input" 
              autocomplete="email"
            >
          </div>
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper has-icons">
            <span class="input-icon-left" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            
            <input 
              type="password" 
              name="password"
              id="password" 

              class="form-input password-input" 
              placeholder="••••••••••••"
            >
            
            <button type="button" id="toggle-password-btn" class="input-icon-right-btn" aria-label="Toggle password visibility">
              <svg id="eye-open-icon" class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-closed-icon" class="eye-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        
        <button type="submit" class="submit-btn" id="submit-btn">
          <span class="btn-text">Sign In</span>
          <span class="btn-arrow" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </span>
        </button>
      </form>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('toggle-password-btn');
      const eyeOpen = document.getElementById('eye-open-icon');
      const eyeClosed = document.getElementById('eye-closed-icon');

      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          eyeOpen.style.display = 'none';
          eyeClosed.style.display = 'block';
          toggleBtn.setAttribute('aria-label', 'Hide password');
        } else {
          passwordInput.setAttribute('type', 'password');
          eyeOpen.style.display = 'block';
          eyeClosed.style.display = 'none';
          toggleBtn.setAttribute('aria-label', 'Show password');
        }
      });
    });
  </script>
</body>
</html>
