<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Creator</title>
  <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"/>
  <link rel="stylesheet" href="{% static 'css/staff/new_category.css' %}?v=9">
</head>
<body>
  <div class="container">
    <div class="card">
<form id="categoryForm" class="card-form" method="post" enctype="multipart/form-data">          {% csrf_token %}

        <div class="card-section top-section">
          <div class="form-group">
            <label for="category-name">CATEGORY NAME</label>
            <input
              type="text"
              id="category-name"
              name="name"
              placeholder="e.g. Man"
              value="{{ name }}"
            >
{% if errors.name %}
<small class="field-error">
    {{ errors.name }}
</small>
{% endif %}
          </div>

          <div class="form-group">
            <label for="offer">OFFER</label>
            <div class="input-with-suffix">
              <input
                type="number"
                id="offer"
                name="offer"
              
                value="{{ offer }}"
              >
              <span class="suffix">%</span>
            </div>
             <small class="field-error-container"></small>

          </div>
        </div>


        <div class="card-section upload-section">

  <div class="upload-box" id="upload-box">

    <input
      type="file"
      id="file-input"
      name="image_url"
      accept="image/*"
      class="file-input"
    >

    <!-- Default Upload Content -->
    <div class="upload-content" id="upload-content">
      <div class="upload-icon-wrapper">
        <svg class="upload-icon"
             xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
        </svg>

      </div>

      <span class="upload-text">
        Upload Category Image
      </span>
    </div>

    <!-- Preview -->
    <div class="image-preview-container" id="preview-container">
      <img id="preview-image" alt="Preview">

      <button
        type="button"
        id="change-image"
        class="change-image-btn">
        Change Image
      </button>
    </div>
<small id="image-error-container">
    {% if errors.image %}
        {{ errors.image }}
    {% endif %}
</small>

  </div>

</div>
        

        <div class="card-section actions-section">
          <a href="{% url 'category_management' %}"
             class="btn btn-cancel"
             style="text-decoration: none;">
            CANCEL
          </a>

          <button type="submit" class="btn btn-save">
            <svg class="save-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M5 3a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7.414A2 2 0 0020.414 6L18 3.586A2 2 0 0016.586 3H5zm4 2h6v3H9V5zm7 14H8v-6h8v6z"/>
            </svg>
            Save Category
          </button>
        </div>
      </form>
    </div>
  </div>


 <div class="crop-modal" id="crop-modal">

  <div class="crop-card">

    <div class="crop-header">
      <h3>Adjust Image</h3>
    </div>

    <div class="crop-body">
      <img id="crop-image">
    </div>

    <div class="crop-actions">
      <button
        type="button"
        class="btn btn-cancel"
        id="cancel-crop">
        Cancel
      </button>

      <button
        type="button"
        class="btn btn-save"
        id="crop-btn">
        Apply
      </button>
    </div>

  </div>

</div>

<div id="toast-container">
    {% if messages %}
        {% for message in messages %}
            <div class="toast {{ message.tags }}">
                <span>{{ message }}</span>
                <button type="button" class="toast-close">&times;</button>
            </div>
        {% endfor %}
    {% endif %}
</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>

  <script src="{% static 'js/new_category.js' %}?v=9">
</script>
</body>
</html>
