<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Editing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/staff/edit_category.css' %}?v=11">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

</head>
<body>
    <main class="page-wrapper">
        <div class="card" aria-label="Category Form Container">
            <form class="form" id="categoryForm" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="input-group">
                    <label for="categoryName" class="input-label">Category Name</label>
                    <input
                        type="text"
                        id="categoryName"
                        name="categoryName"
                        class="input-field"
                        value="{{ category.name }}"
                    >
                </div>

                <div class="input-group">
                    <label for="offer" class="input-label">Offer</label>
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="offer"
                            name="offer"
                            class="input-field offer-input"
                            value="{{ category.offer }}"
                        >
                        <span class="input-suffix">%</span>
                    </div>
                </div>

                <div class="divider"></div>
                    <div class="upload-zone" id="uploadZone">

    <input
        type="file"
        id="fileInput"
        name="image"
        accept="image/*"
        hidden
    >

    <img
        id="previewImage"
        class="preview-image"
        src="{% if category.image_url %}{{ category.image_url.url }}{% endif %}"
        alt="Preview"
    >

    <div class="upload-content" id="uploadContent">

        <div class="upload-badge">
            <svg xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="cloud-icon">
                <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
                <path d="M12 12v9"/>
                <path d="m16 16-4-4-4 4"/>
            </svg>
        </div>

        <span class="upload-text">
            Upload Category Image
        </span>

    </div>

</div>
            

                <div class="divider"></div>

                <div class="btn-row">
                    <button type="button" class="btn btn-cancel" id="btnCancel">CANCEL</button>
                    <button type="submit" class="btn btn-save" id="btnSave">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="save-icon">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                            <polyline points="17 21 17 13 7 13 7 21" />
                            <polyline points="7 3 7 8 15 8" />
                        </svg>
                        Save Category
                    </button>
                </div>

              
            </form>
        </div>
    </main>

            </form>
        </div>
    </div>


    <div class="crop-modal" id="cropModal">

    <div class="crop-card">

        <div class="crop-header">
            <h3>Adjust Image</h3>
        </div>

        <div class="crop-body">
    <div class="cropper-wrapper">
        <img id="cropImage">
    </div>
</div>

        <div class="crop-actions">
            <button type="button"
                class="btn btn-cancel"
                id="cancelCrop">
                Cancel
            </button>

            <button type="button"
                class="btn btn-save"
                id="applyCrop">
                Apply
            </button>
        </div>

    </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script>
/* ==========================================
   IMAGE UPLOAD + PREVIEW + CROPPER
========================================== */

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

const previewImage =
    document.getElementById('previewImage');

const cropModal =
    document.getElementById('cropModal');

const cropImage =
    document.getElementById('cropImage');

const applyCrop =
    document.getElementById('applyCrop');

const cancelCrop =
    document.getElementById('cancelCrop');

let cropper = null;

/* Show existing category image */

if (
    previewImage &&
    previewImage.getAttribute('src') &&
    previewImage.getAttribute('src').trim() !== ''
) {
    previewImage.style.display = 'block';

    uploadZone.classList.add('has-image');
}

/* Open file picker */

uploadZone.addEventListener('click', () => {
    fileInput.click();
});

uploadZone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileInput.click();
    }
});

/* Select Image */

fileInput.addEventListener('change', function (e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (event) {

        cropImage.src = event.target.result;

        cropModal.style.display = 'flex';

        if (cropper) {
            cropper.destroy();
        }

     cropper = new Cropper(cropImage,{
    aspectRatio: 1,
    viewMode: 2,
    dragMode: 'move',
    autoCropArea: 0.9,
    responsive: true,
    restore: false,
    guides: false,
    center: false,
    highlight: false,
    background: false,
    cropBoxMovable: true,
    cropBoxResizable: true,
    movable: true,
    zoomable: true
});
    };

    reader.readAsDataURL(file);
});

/* Apply Crop */

applyCrop.addEventListener('click', function () {

    if (!cropper) return;

    const canvas = cropper.getCroppedCanvas({
        width: 800,
        height: 800,
        imageSmoothingQuality: 'high'
    });

    previewImage.src =
        canvas.toDataURL('image/jpeg', 0.9);

    previewImage.style.display = 'block';

    uploadZone.classList.add('has-image');

    canvas.toBlob(function (blob) {

        const croppedFile = new File(
            [blob],
            'category.jpg',
            {
                type: 'image/jpeg'
            }
        );

        const dataTransfer =
            new DataTransfer();

        dataTransfer.items.add(croppedFile);

        fileInput.files =
            dataTransfer.files;

    }, 'image/jpeg', 0.9);

    cropModal.style.display = 'none';

    cropper.destroy();
    cropper = null;
});

/* Cancel Crop */

cancelCrop.addEventListener('click', function () {

    cropModal.style.display = 'none';

    if (cropper) {
        cropper.destroy();
        cropper = null;
    }
});

/* ==========================================
   DELETE MODAL
========================================== */

const deleteModal =
    document.getElementById('deleteModal');

const deleteForm =
    document.getElementById('deleteForm');

const deleteModalText =
    document.getElementById('deleteModalText');

function openDeleteModal(id, name, url) {

    deleteForm.action = url;

    deleteModalText.textContent =
        `Are you sure you want to delete "${name}"?`;

    deleteModal.style.display = 'flex';
}

function closeDeleteModal() {
    deleteModal.style.display = 'none';
}

window.addEventListener('click', function (e) {

    if (e.target === deleteModal) {
        closeDeleteModal();
    }
});

document.addEventListener('keydown', function (e) {

    if (
        e.key === 'Escape' &&
        deleteModal.style.display === 'flex'
    ) {
        closeDeleteModal();
    }

    if (
        e.key === 'Escape' &&
        cropModal.style.display === 'flex'
    ) {
        cropModal.style.display = 'none';

        if (cropper) {
            cropper.destroy();
            cropper = null;
        }
    }
});

/* ==========================================
   CANCEL BUTTON
========================================== */

const btnCancel =
    document.getElementById('btnCancel');

if (btnCancel) {

    btnCancel.addEventListener('click', function () {
        window.history.back();
    });
}
</script>
</body>
</html>
