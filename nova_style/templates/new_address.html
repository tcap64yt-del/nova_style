<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA STYLE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/new_address.css' %}">
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <div class="logo">
        <a href="{% url "home" %}">NOVA STYLE</a>
      </div>

      <div class="header-actions">
        <a href="#" class="action-btn" aria-label="Wishlist">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icon-svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
          </svg>
        </a>
        <a href="#" class="action-btn" aria-label="Shopping Bag">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icon-svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
        </a>
        <div class="user-avatar-header">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=80&h=80&q=80" alt="User Profile" class="header-avatar-img">
        </div>
      </div>
    </div>
  </header>

  <div class="dashboard-wrapper">
    <div class="dashboard-container">
      <aside class="sidebar">
        <h2 class="sidebar-title">Dashboard</h2>

        <nav class="sidebar-nav">
          <a href="{% url "profile" %}" class="sidebar-link">
            <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Profile</span>
          </a>

          <a href="{% url "addresses" %}" class="sidebar-link active">
            <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>
            <span>Addresses</span>
          </a>

          <a href="#" class="sidebar-link">
            <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="15" rx="2"/>
              <path d="M16 2v2M8 2v2M3 10h18"/>
            </svg>
            <span>Orders</span>
          </a>

          <a href="#" class="sidebar-link">
            <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
            <span>Wallet</span>
          </a>

          <a href="#" class="sidebar-link">
            <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
              <line x1="7" y1="7" x2="7.01" y2="7"/>
            </svg>
            <span>Coupons</span>
          </a>

          <a href="#" class="sidebar-link">
            <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
            <span>Wishlist</span>
          </a>
        </nav>
      </aside>

      <main class="main-content">
        <div class="content-header">
          <h1 class="main-title">ADD NEW ADDRESS</h1>
          <p class="main-subtitle">Set your delivery preferences for a curated shipping experience.</p>
        </div>

        <section class="address-form-card">
          <form class="address-form" onsubmit="event.preventDefault();">
            <div class="form-row full-width">
              <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">
              </div>
            </div>

            <div class="form-row three-col">
              <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="Enter phone number">
              </div>

              <div class="form-group">
                <label for="state">State</label>
                <input type="text" id="state" placeholder="Enter state">
              </div>

              <div class="form-group">
                <label for="district">District</label>
                <input type="text" id="district" placeholder="Enter district">
              </div>
            </div>

            <div class="form-row two-col">
              <div class="form-group">
                <label for="country">Country</label>
                <input type="text" id="country" placeholder="Enter country">
              </div>

              <div class="form-group">
                <label for="postal-code">Postal Code</label>
                <input type="text" id="postal-code" placeholder="Enter postal code">
              </div>
            </div>

            <div class="form-row full-width">
              <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" placeholder="Flat, House no., Building, Company, Apartment"></textarea>
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn-cancel">Cancel</button>
              <button type="submit" class="btn-save">Save Address</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <footer class="main-footer">
    <div class="footer-links">
      <a href="#" class="footer-link">Privacy</a>
      <a href="#" class="footer-link">Terms</a>
      <a href="#" class="footer-link">Shipping</a>
      <a href="#" class="footer-link">Contact</a>
    </div>
    <div class="footer-copyright">
      &copy; 2024 NOVA STYLE. ALL RIGHTS RESERVED.
    </div>
  </footer>

</body>
</html>
