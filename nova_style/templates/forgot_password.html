<!DOCTYPE html>
<html lang="en">
<head>
    {% load static  %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NOVA STYLE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static "css/forgot_password.css" %}">
</head>
<body>
    <div class="page-container">
        <header class="brand-logo">NOVA STYLE</header>

        <main class="auth-card">
            <h1 class="card-title">Forgot your password?</h1>
            <p class="card-description">
                No worries, enter your email below and we'll send you a recovery link.
            </p>

            <form class="reset-form" onsubmit="event.preventDefault(); alert('Reset link sent!');">
                <div class="input-group">
                    <label for="email" class="input-label">EMAIL ADDRESS</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        class="input-field" 
                        placeholder="Abc@gmail.com" 
                        required 
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="submit-button">
                    <span>Send Reset Link</span>
                    <svg class="button-arrow" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 8H15M15 8L8 1M15 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </main>
        <footer class="footer-navigation">
            <a href="#" class="back-link">
                <svg class="back-arrow" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 8H1M1 8L8 15M1 8L8 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Back to Login</span>
            </a>
        </footer>
    </div>
</body>
</html>
