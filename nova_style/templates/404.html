<!-- templates/404.html -->

<!DOCTYPE html>
<html>
<head>
    <title>Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            font-size: 80px;
            margin: 0;
        }

        p {
            font-size: 20px;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: black;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>Sorry, the page you are looking for does not exist.</p>

    <a href="{% url "home" %}">Go to Home</a>

</body>
</html>
