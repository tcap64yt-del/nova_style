{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Complete - Nova Style</title>
  <link rel="stylesheet" href="{% static 'css/user/registration/password_reset_complete.css' %}">
</head>
<body>
