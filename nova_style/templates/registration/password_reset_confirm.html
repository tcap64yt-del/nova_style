{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Style</title>
  <link rel="stylesheet" href="{% static 'css//registration/password_reset_confirm.css' %}?v=2">
</head>
<body>
  <main class="page">
    <div class="brand">NOVA STYLE</div>

    <section class="card">
      <form method="post" class="reset-form">
        {% csrf_token %}

        <div class="field">
          <label class="label">NEW PASSWORD</label>
          {{ form.new_password1 }}
          {{ form.new_password1.errors }}
        </div>

        <div class="field">
          <label class="label">CONFIRM NEW PASSWORD</label>
          {{ form.new_password2 }}
          {{ form.new_password2.errors }}
        </div>

        <div class="actions">
          <button type="submit" class="btn-submit">Save New Password</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
